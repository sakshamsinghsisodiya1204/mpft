<div class="shell">

    <div class="brand"><b id="whoami">MPFT</b><span>multipath file transfer</span></div>
    <nav aria-label="Main">
    <a href="#/send"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8l10-5-4 10-2-4-4-1z"/></svg>Send</a>
    <a href="#/receive"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m-3-3l3 3 3-3M3 13h10"/></svg>Receive</a>
    <a href="#/transfer" id="nav-transfer"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5h10m-3-3l3 3-3 3M14 11H4m3-3l-3 3 3 3"/></svg>Transfer</a>
    <a href="#/history"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg>History</a>

    </div>
  </aside>
  <div class="main-col">
    <header class="topbar"><h1 id="page-title">Send</h1><span id="top-state" role="status"></span></header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
